[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-coder"
version = "1.4.0"
license = {file = "LICENSE"}
description = "◈ agent — a safety-first coding agent for Termux"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.58,<1",
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.6,<3",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
termux-coder = "termux_coder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
